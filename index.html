<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STASH — Отправить файл на печать</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #111;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.4;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            color: white;
            box-sizing: border-box;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active {
            opacity: 0.8;
        }
        .btn-viber { background-color: #7360f2; }
        .btn-telegram { background-color: #24a1de; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-file { background-color: #ff8c00; }
        .btn-email { background-color: #4285f4; }
        
        .file-box {
            background: #fafafa;
            border: 2px dashed #ddd;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
        }
        .file-box label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input[type="file"] {
            width: 100%;
            font-size: 13px;
            color: #555;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>STASH</h1>
    <div class="subtitle">Выберите способ отправки файла для печати:</div>

    <!-- Прямая загрузка файла с устройства на почту -->
    <div class="file-box">
        <label>📁 Выбрать файл с телефона:</label>
        <input type="file" id="fileInput">
        <button class="btn btn-file" onclick="sendFileEmail()" style="margin-top: 10px; margin-bottom: 0;">Отправить выбранный файл</button>
    </div>

    <!-- Viber -->
    <a href="https://viber.me/375291507774" class="btn btn-viber">
        💬 Отправить в Viber
    </a>

    <!-- Telegram -->
    <a href="https://t.me/375291507774" class="btn btn-telegram">
        ✈️ Отправить в Telegram
    </a>

    <!-- WhatsApp -->
    <a href="https://wa.me/375291507774" class="btn btn-whatsapp">
        🟢 Отправить в WhatsApp
    </a>

    <!-- Email -->
    <a href="mailto:info@stash.by?subject=Печать документа" class="btn btn-email">
        📧 Написать на Email
    </a>

    <div class="footer">
        Сервис технического ремонта и печати STASH
    </div>
</div>

<script>
    function sendFileEmail() {
        const fileInput = document.getElementById('fileInput');
        if (fileInput.files.length === 0) {
            alert('Пожалуйста, выберите файл перед отправкой!');
            return;
        }
        const fileName = fileInput.files[0].name;
        window.location.href = `mailto:info@stash.by?subject=Печать: ${encodeURIComponent(fileName)}&body=Файл прикреплен пользователем с телефона.`;
    }
</script>

</body>
</html>
