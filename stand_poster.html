<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Табличка STASH — Максимальный QR и NFC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #cbd5e1;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Панель управления на экране */
        .controls-bar {
            background: #ffffff;
            padding: 12px 24px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }
        .btn-print {
            background: #0f172a;
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            border: none;
            padding: 10px 22px;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-print:hover { background: #1e293b; }
        .format-select {
            padding: 8px 12px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            cursor: pointer;
        }

        /* Лист макета (А4) */
        .sheet {
            background: #ffffff;
            width: 210mm;
            min-height: 297mm;
            height: 297mm;
            padding: 10mm 14mm 12mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            position: relative;
            overflow: hidden;
        }

        /* Формат А5 */
        .sheet.a5 {
            width: 148mm;
            min-height: 210mm;
            height: 210mm;
            padding: 8mm 10mm;
        }

        /* Исходная шапка без плашек */
        .header {
            text-align: center;
        }
        .header h1 {
            font-size: 46px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #0f172a;
            line-height: 1.1;
        }
        .header h2 {
            font-size: 23px;
            font-weight: 800;
            color: #1e293b;
            margin-top: 4px;
        }
        .header p {
            font-size: 15px;
            color: #64748b;
            font-weight: 500;
            margin-top: 3px;
        }

        /* Центральная область */
        .center-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: auto 0;
            position: relative;
        }

        /* Рамка вокруг QR */
        .qr-wrapper {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 18px;
        }

        /* Угловые скобки */
        .corner {
            position: absolute;
            width: 44px;
            height: 44px;
            border-color: #0f172a;
            border-style: solid;
        }
        .top-left { top: 0; left: 0; border-width: 6px 0 0 6px; border-top-left-radius: 18px; }
        .top-right { top: 0; right: 0; border-width: 6px 6px 0 0; border-top-right-radius: 18px; }
        .bottom-left { bottom: 0; left: 0; border-width: 0 0 6px 6px; border-bottom-left-radius: 18px; }
        .bottom-right { bottom: 0; right: 0; border-width: 0 6px 6px 0; border-bottom-right-radius: 18px; }

        #qrcode {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #qrcode img {
            display: block;
        }

        /* Прежний логотип NFC по центру QR-кода */
        .nfc-center-badge {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 86px;
            height: 86px;
            background: #ffffff;
            border: 3.5px solid #0f172a;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
            z-index: 10;
        }
        .nfc-center-badge svg {
            width: 38px;
            height: 38px;
            fill: #475569;
        }
        .nfc-center-badge span {
            font-size: 9px;
            font-weight: 800;
            color: #475569;
            letter-spacing: 0.5px;
            margin-top: 1px;
            text-transform: uppercase;
        }

        /* Подпись под QR */
        .scan-caption {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 3 шага */
        .steps {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }
        .step {
            border-radius: 12px;
            padding: 10px 8px;
            text-align: center;
            border: 2px solid transparent;
        }
        .step-1 { background: #f0fdf4; border-color: #bbf7d0; }
        .step-2 { background: #f5f3ff; border-color: #ddd6fe; }
        .step-3 { background: #eff6ff; border-color: #bfdbfe; }

        .step-num {
            display: inline-block;
            font-size: 11px;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 10px;
            margin-bottom: 3px;
            color: #ffffff;
        }
        .step-1 .step-num { background: #16a34a; }
        .step-2 .step-num { background: #7c3aed; }
        .step-3 .step-num { background: #2563eb; }

        .step-name {
            font-size: 14px;
            font-weight: 800;
            color: #0f172a;
        }
        .step-info {
            font-size: 11px;
            color: #475569;
            font-weight: 600;
            margin-top: 2px;
            line-height: 1.25;
        }

        /* Нижняя строка контактов */
        .footer-contacts {
            border-top: 2px solid #e2e8f0;
            padding-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .phone-highlight {
            font-size: 21px;
            font-weight: 900;
            color: #0f172a;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .email-highlight {
            font-size: 18px;
            font-weight: 800;
            color: #0f172a;
            white-space: nowrap;
        }

        /* Адаптация под формат А5 */
        .sheet.a5 .header h1 { font-size: 30px; }
        .sheet.a5 .header h2 { font-size: 15px; }
        .sheet.a5 .header p { font-size: 10px; }

        .sheet.a5 .qr-wrapper { padding: 10px; }
        .sheet.a5 .corner { width: 28px; height: 28px; }
        .sheet.a5 .top-left { border-width: 4px 0 0 4px; border-top-left-radius: 10px; }
        .sheet.a5 .top-right { border-width: 4px 4px 0 0; border-top-right-radius: 10px; }
        .sheet.a5 .bottom-left { border-width: 0 0 4px 4px; border-bottom-left-radius: 10px; }
        .sheet.a5 .bottom-right { border-width: 0 4px 4px 0; border-bottom-right-radius: 10px; }

        .sheet.a5 .nfc-center-badge { width: 60px; height: 60px; border-width: 2.5px; }
        .sheet.a5 .nfc-center-badge svg { width: 26px; height: 26px; }
        .sheet.a5 .nfc-center-badge span { font-size: 7px; }

        .sheet.a5 .scan-caption { font-size: 11px; margin-top: 6px; }
        .sheet.a5 .steps { gap: 6px; margin-bottom: 8px; }
        .sheet.a5 .step { padding: 6px 4px; border-radius: 8px; }
        .sheet.a5 .step-num { font-size: 9px; padding: 1px 6px; }
        .sheet.a5 .step-name { font-size: 11px; }
        .sheet.a5 .step-info { font-size: 9px; }

        .sheet.a5 .footer-contacts { padding-top: 6px; }
        .sheet.a5 .phone-highlight { font-size: 15px; }
        .sheet.a5 .email-highlight { font-size: 13px; }

        /* Чистая печать */
        @media print {
            body {
                background: none;
                padding: 0;
            }
            .controls-bar {
                display: none !important;
            }
            .sheet {
                box-shadow: none !important;
                margin: 0 !important;
                page-break-after: avoid;
                page-break-inside: avoid;
            }
            @page {
                margin: 0;
                size: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Меню переключения -->
    <div class="controls-bar">
        <label style="font-weight: 700; font-size: 14px;">Размер макета:</label>
        <select class="format-select" onchange="changeFormat(this.value)">
            <option value="a4" selected>Формат А4 (Большой лист)</option>
            <option value="a5">Формат А5 (Подставка / Тейбл-тент)</option>
        </select>
        <button class="btn-print" onclick="window.print()">
            🖨️ Распечатать / Сохранить в PDF
        </button>
    </div>

    <!-- Печатный лист -->
    <div id="printSheet" class="sheet">
        
        <!-- Прежний лаконичный заголовок -->
        <div class="header">
            <h1>STASH</h1>
            <h2>Печать с телефона за 10 секунд</h2>
            <p>Без проводов, очередей и поиска контактов</p>
        </div>

        <!-- Центр: Максимально увеличенный QR с прежним логотипом NFC по центру -->
        <div class="center-stage">
            <div class="qr-wrapper">
                <div class="corner top-left"></div>
                <div class="corner top-right"></div>
                <div class="corner bottom-left"></div>
                <div class="corner bottom-right"></div>

                <!-- Контейнер QR-кода -->
                <div id="qrcode"></div>

                <!-- Прежний значок смартфона с волнами NFC по центру -->
                <div class="nfc-center-badge">
                    <svg viewBox="0 0 24 24">
                        <path d="M17 1H7C5.9 1 5 1.9 5 3v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-2-2-2zm0 18H7V5h10v14zm-4.2-11c1.3.4 2.2 1.5 2.2 2.8s-.9 2.4-2.2 2.8v1.1c1.9-.5 3.2-2.1 3.2-3.9s-1.3-3.4-3.2-3.9v1.1zm-1.8 1.4v1.8c.4.2.7.7.7 1.2s-.3 1-.7 1.2v1.8c1.3-.3 2.3-1.5 2.3-3s-1-2.7-2.3-3z"/>
                    </svg>
                    <span>NFC</span>
                </div>
            </div>

            <div class="scan-caption">
                📷 Наведите камеру или приложите телефон
            </div>
        </div>

        <!-- 3 цветных шага -->
        <div class="steps">
            <div class="step step-1">
                <span class="step-num">1</span>
                <div class="step-name">Сканируйте</div>
                <div class="step-info">Камерой смартфона или через NFC</div>
            </div>
            <div class="step step-2">
                <span class="step-num">2</span>
                <div class="step-name">Отправьте</div>
                <div class="step-info">Viber, Telegram или WhatsApp</div>
            </div>
            <div class="step step-3">
                <span class="step-num">3</span>
                <div class="step-name">Заберите</div>
                <div class="step-info">Готовые распечатанные документы</div>
            </div>
        </div>

        <!-- Нижняя строка: крупный номер и почта -->
        <div class="footer-contacts">
            <div class="phone-highlight">📞 +375 (29) 150-77-74</div>
            <div class="email-highlight">✉️ info@stash.by</div>
        </div>

    </div>

    <script>
        const TARGET_URL = "https://wild-osp.github.io/STASH-print/";
        let qrCodeObj = null;

        function drawQR(pixelSize) {
            const container = document.getElementById("qrcode");
            container.innerHTML = "";
            qrCodeObj = new QRCode(container, {
                text: TARGET_URL,
                width: pixelSize,
                height: pixelSize,
                colorDark: "#0f172a",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function changeFormat(val) {
            const sheet = document.getElementById("printSheet");
            if (val === "a5") {
                sheet.classList.add("a5");
                drawQR(310); // Увеличенный размер для А5
            } else {
                sheet.classList.remove("a5");
                drawQR(470); // Максимальный размер под А4
            }
        }

        // Первичный рендер для A4
        drawQR(470);
    </script>
</body>
</html>
